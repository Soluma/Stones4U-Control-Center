# Stones4U Control Center — staging.
# See docs/deployment/FLY-STAGING.md for the full deployment procedure.
# No secret values live here — DATABASE_URL/SESSION_SECRET/SHOPIFY_* are
# Fly secrets, injected at runtime only.

app = "stones4u-control-center-staging"
primary_region = "ams"

[build]

[env]
  APP_ENV = "staging"

# Runs once, before new machines start, using the same image that's about
# to be deployed. Serialized by Fly (not run per-machine), so migrations
# never race each other across multiple web machines.
[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
